<script type="module">
  // --- Importações do Firebase ---
  import { 
    initializeApp 
  } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";

  import { 
    getAuth, 
    onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc
  } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

  // --- Configuração do Firebase ---
  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_PROJETO.firebaseapp.com",
    projectId: "SEU_PROJETO",
    storageBucket: "SEU_PROJETO.appspot.com",
    messagingSenderId: "...",
    appId: "..."
  };

  // Inicialização
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // --- Verificar usuário logado ---
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      alert("Você precisa estar logado!");
      window.location.href = "index.html";
      return;
    }

    // --- Garantir que o mestre é o email mestre@rpg.com ---
    if (user.email !== "mestre@rpg.com") {
      alert("Apenas o MESTRE pode acessar esta página.");
      window.location.href = "index.html";
      return;
    }

    console.log("Acesso liberado para o mestre:", user.email);
  });

  // --- Exemplo de função para criar um boss ---
  const formBoss = document.getElementById("form-boss");

  formBoss?.addEventListener("submit", async (e) => {
    e.preventDefault();

    const nome = document.getElementById("boss-nome").value;
    const vida = document.getElementById("boss-vida").value;

    await addDoc(collection(db, "bosses"), {
      nome, vida
    });

    alert("Boss criado!");
  });
</script>
