<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ficha do Personagem</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Sua Ficha</h1>
<button onclick="logout()">Sair</button>

<input id="nome" placeholder="Nome do personagem">
<input id="classe" placeholder="Classe">
<input id="vida" placeholder="Vida">
<input id="sanidade" placeholder="Sanidade">
<input id="ea" placeholder="Energia Amaldiçoada">
<textarea id="inventario" placeholder="Inventário"></textarea>
<textarea id="habilidades" placeholder="Habilidades"></textarea>
<textarea id="historico" placeholder="Histórico"></textarea>
<input id="foto" placeholder="URL da foto">

<button onclick="salvarFicha()">Salvar</button>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script src="ficha.js"></script>

</body>
</html>
